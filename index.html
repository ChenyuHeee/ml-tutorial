<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>从零开始的机器学习教程</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- (Optional) code highlight -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="title">从零开始的机器学习教程</div>
          <div class="subtitle">GitHub Pages 阅读版</div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="footer">
          <div class="hint">提示：左侧选择章节</div>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <div id="currentTitle" class="current-title">加载中…</div>
          <div class="spacer"></div>

          <div class="search" id="searchBox">
            <input
              id="searchInput"
              class="search-input"
              type="search"
              placeholder="搜索（标题/内容）…"
              autocomplete="off"
            />
            <div id="searchResults" class="search-results" hidden></div>
          </div>

          <a id="openRaw" class="raw" href="#" target="_blank" rel="noreferrer">打开原文</a>
        </div>

        <article id="content" class="content"></article>

        <div class="pager">
          <button id="prevBtn" class="btn" type="button">上一章</button>
          <button id="nextBtn" class="btn" type="button">下一章</button>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
